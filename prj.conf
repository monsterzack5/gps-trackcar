CONFIG_GPIO=y
CONFIG_CPP=y

# Accelerometer
CONFIG_I2C=y
CONFIG_SENSOR=y
CONFIG_LIS2DH=y

#define CONFIG_GNSS_MODE_PERIODIC 1
#define CONFIG_GNSS_PERIODIC_INTERVAL 10
#define CONFIG_GNSS_PERIODIC_TIMEOUT 120

#define CONFIG_GNSS_ASSISTANCE_MINIMAL 1
#define CONFIG_GNSS_LTE_ON_DEMAND 1
#undef CONFIG_GNSS_ASSISTANCE_NONE


# Periodic or Continuous 
CONFIG_GNSS_MODE_PERIODIC=y
CONFIG_GNSS_PERIODIC_INTERVAL=10
CONFIG_GNSS_PERIODIC_TIMEOUT=120

# Minimal is use an almanac
CONFIG_GNSS_ASSISTANCE_MINIMAL=y
# Not sure how I want to handle this in the future
CONFIG_GNSS_LTE_ON_DEMAND=y

CONFIG_NVS=y
CONFIG_SETTINGS_NVS=y
CONFIG_SETTINGS=y
CONFIG_FLASH=y
CONFIG_FLASH_PAGE_LAYOUT=y
CONFIG_FLASH_MAP=y
CONFIG_SPI=y
CONFIG_FCB=y

# General
CONFIG_FPU=y
CONFIG_NRF_MODEM_LIB=y
CONFIG_STDOUT_CONSOLE=y
CONFIG_UART_INTERRUPT_DRIVEN=y
CONFIG_PICOLIBC_IO_FLOAT=y
CONFIG_LOG=y
CONFIG_LOG_MODE_IMMEDIATE=y

# LTE Link Control
CONFIG_LTE_LINK_CONTROL=y
# Request eDRX from the network
CONFIG_LTE_LC_EDRX_MODULE=y
CONFIG_LTE_EDRX_REQ=y
# PSM requested periodic TAU 8 hours
CONFIG_LTE_LC_PSM_MODULE=y
CONFIG_LTE_PSM_REQ_RPTAU="00101000"
# PSM requested active time 6 seconds
CONFIG_LTE_PSM_REQ_RAT="00000011"

# AT Host library - Used to send AT commands directy from an UART terminal and to allow
#		    integration with nRF Connect for Desktop LTE Link monitor application.
CONFIG_AT_HOST_LIBRARY=y

# Networking
CONFIG_NETWORKING=y
CONFIG_NET_SOCKETS_OFFLOAD=y
CONFIG_NET_SOCKETS=y
CONFIG_POSIX_API=y
# Disable native network stack to save some memory
CONFIG_NET_NATIVE=n

# Memory and stack configuration
CONFIG_HEAP_MEM_POOL_SIZE=2048
CONFIG_MAIN_STACK_SIZE=4096
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=1536
