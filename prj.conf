# General
CONFIG_FPU=y
CONFIG_NRF_MODEM_LIB=y
CONFIG_STDOUT_CONSOLE=y
CONFIG_UART_INTERRUPT_DRIVEN=y
CONFIG_PICOLIBC_IO_FLOAT=y
CONFIG_AT_HOST_LIBRARY=n
CONFIG_GPIO=y
CONFIG_CPP=y

### Debugging
# For these to work, you need to manually edit
# the .config that the nordic vscode plugin creates.
# These are overriden by Nordics plugin, and if you set
# "Optimize for Debugging" in there, the TF-M firmware uses
# 199% of its available flash.
# CONFIG_DEBUG_OPTIMIZATIONS=y
# CONFIG_SIZE_OPTIMIZATIONS=n
# CONFIG_DEBUG=y
# --
# CONFIG_THREAD_ANALYZER=y
# CONFIG_THREAD_ANALYZER_AUTO=y
# CONFIG_THREAD_ANALYZER_AUTO_INTERVAL=10
# CONFIG_THREAD_NAME=y
###

# Accelerometer / Temperature Sensor
CONFIG_I2C=y
CONFIG_SENSOR=y
CONFIG_LIS2DH=y
CONFIG_REGULATOR=y

# LittleFS for modem pages
CONFIG_NVS=y
CONFIG_SETTINGS_NVS=y
CONFIG_SETTINGS=y
CONFIG_FLASH=y
CONFIG_FLASH_PAGE_LAYOUT=y
CONFIG_FLASH_MAP=y
CONFIG_SPI=y
CONFIG_FCB=y

### LTE Settings
# These Need more Research
CONFIG_LTE_LINK_CONTROL=y
# Request eDRX from the network
CONFIG_LTE_LC_EDRX_MODULE=y
CONFIG_LTE_EDRX_REQ=y
# PSM requested periodic TAU 8 hours
CONFIG_LTE_LC_PSM_MODULE=y
CONFIG_LTE_PSM_REQ=y
CONFIG_LTE_PSM_REQ_RPTAU="00101000"
# PSM requested active time 6 seconds
CONFIG_LTE_PSM_REQ_RAT="00000011"
###

### Networking
CONFIG_NETWORKING=y
CONFIG_NET_SOCKETS_OFFLOAD=y
CONFIG_NET_SOCKETS=y
CONFIG_POSIX_API=y
CONFIG_NET_IPV4=y
CONFIG_NET_IPV6=y
CONFIG_MODEM_KEY_MGMT=y

# Disable Duplicate Address Detection (DAD)
# due to not being properly implemented for offloaded interfaces.
# TODO: Really?
CONFIG_NET_IPV6_NBR_CACHE=n
CONFIG_NET_IPV6_MLD=n
###

# Higher level network interface control, versus modem specific commands
CONFIG_NET_CONNECTION_MANAGER=y
CONFIG_NET_CONNECTION_MANAGER_MONITOR_STACK_SIZE=4600
CONFIG_NRF_MODEM_LIB_NET_IF=y
CONFIG_NET_NATIVE=y

# Logging
CONFIG_TRACCAR_DEFAULT_LOG_LEVEL=4
CONFIG_LOG=y
CONFIG_LOG_BACKEND_UART=y
CONFIG_LOG_MODE_DEFERRED=y
CONFIG_LOG_BACKEND_FS=y
CONFIG_LOG_RUNTIME_FILTERING=y

# Memory and stack configuration
CONFIG_HEAP_MEM_POOL_SIZE=4096
CONFIG_MAIN_STACK_SIZE=4096
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=4096
CONFIG_LOG_BUFFER_SIZE=2048
CONFIG_AT_MONITOR_HEAP_SIZE=512
CONFIG_NRF_MODEM_LIB_HEAP_SIZE=2048

# SDCard
CONFIG_TRACKCAR_ENABLE_SD_CARD=y
CONFIG_SPI=y
CONFIG_TFM_SECURE_UART_SHARE_INSTANCE=y
CONFIG_NRF_MODEM_LIB_TRACE=n

# # SD Card support
# CONFIG_DISK_ACCESS=y
# CONFIG_DISK_DRIVERS=y
# CONFIG_DISK_DRIVER_SDMMC=y
# CONFIG_FILE_SYSTEM=y
# CONFIG_FAT_FILESYSTEM_ELM=y
# CONFIG_FILE_SYSTEM_MKFS=y
# CONFIG_FS_FATFS_EXFAT=y

# SDCard Backend Logging
CONFIG_LOG_BACKEND_FS_FILE_PREFIX="log"
CONFIG_LOG_BACKEND_FS_DIR="/SD:/logs"
CONFIG_LOG_BACKEND_FS_FILE_SIZE=1024000000
CONFIG_LOG_BACKEND_FS_FILES_LIMIT=16
# DO NOT set this while using FS backend, it causes an infinite loop!
# CONFIG_SD_LOG_LEVEL_DBG=y


# CONFIG_DEBUG=y